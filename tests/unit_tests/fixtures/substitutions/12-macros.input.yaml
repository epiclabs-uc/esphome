substitutions:
  display_scale: 1.5
  a: 10
  b: 4
  c: 79
  func: double
  position:
    x: 4
    y: 3
  double_a: ${double(a)}

  $macros:
    multiply:
      parameters:
        a: 3
        b: ${b}
      return: a*b
    modulus:
      parameters:
        vec:
          x: 0
          y: 0
      return: math.sqrt(vec.x*vec.x+vec.y*vec.y)
    scale:
      parameters:
        x: 0
        factor:
      return: (x * (display_scale if factor is none else factor)) | round | int
    square:
      parameters:
        x: 0
      return: x*x
    double:
      parameters:
        x: 0
      return: x*2
    pin:
      parameters:
        number: 10
        inverted: false
      body: !literal |
        #if number > 20
        ${
          {
              "number": number,
              "inverted" : inverted,
              "pullup": true
          }
        }
        #else
        ${
          {
              "number": number,
              "inverted" : inverted,
          }
        }
        #endif

testlist:
  - Substitutions are evaluated before jinja, ${ ${func}(a) }
  - Distance = ${modulus(position) | int}
  - multiply(6,7) = ${ multiply(6,7) }
  - multiply(2) = ${ multiply(2) }, because parameter b has a default value of 4
  - multiply(a=5, b=7) = ${multiply(a=5, b=7)}
  - scale(100) = ${ scale(100) } because macro takes display_scale as default
  - scale(100, 1.377892) = ${ scale(100, 1.377892) }
  - square(a) = ${square(a)}
  - double(b) = ${double(b)}
  - ${pin(inverted=True)}
  - ${pin()}
  - ${pin(22)}
